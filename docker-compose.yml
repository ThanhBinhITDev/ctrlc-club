version: '3.8'

services:
  # Backend Laravel
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000" # Đổi từ 8000 -> 8001
    volumes:
      - ./backend:/var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=base64:$(php artisan key:generate --show)
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
    networks:
      - ctrlc-network

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3000" # Đổi từ 3000 -> 3001
    volumes:
      - ./frontend:/app
      - /app/node_modules # Anonymous volume để bảo vệ node_modules trong container
      - /app/.next # Anonymous volume để bảo vệ build cache trong container
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001/api/v1 # Cập nhật URL API mới
    depends_on:
      - backend
    networks:
      - ctrlc-network

networks:
  ctrlc-network:
    driver: bridge
